[purescript]
directory = "purescript"
package = "integration-digitalocean"
main = "Infra.Main"

[lean]
directory = "lean/integration-digitalocean"
main = "infra"
core = { path = "lean" }

[providers.digitalocean]
source = "digitalocean/digitalocean"
version = "2.100.0"
module_root = "DigitalOcean"

[workspace]
directory = ".inframe"
graph_directory = ".inframe/graphs"

[stacks.smoke]
frontend = "lean"

[stacks.smoke.backend]
type = "local"

[stacks.example]
frontend = "purescript"
main = "Infra.Platform"
test = "Infra.PlatformTest"

[stacks.example.backend]
type = "local"

[stacks.lean-example]
frontend = "lean"
main = "platform"
test = "platform-test"

[stacks.lean-example.gate]
module = "Infra.PlatformTest"
program = "infrastructure"
policy = "policies"
proof = "platform_gate"

[stacks.lean-example.backend]
type = "local"

# A larger stack split across modules, and a stack that reads its exports: what
# `inframe serve` is most worth pointing at.
[stacks.atlas]
frontend = "lean"
main = "atlas"

[stacks.atlas.backend]
type = "local"

[stacks.storefront]
frontend = "lean"
main = "storefront"

[stacks.storefront.backend]
type = "local"
