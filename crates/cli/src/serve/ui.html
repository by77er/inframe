<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inframe</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='8' height='14' rx='2' fill='%232a78d6'/%3E%3Crect x='10' y='1' width='5' height='6' rx='1.5' fill='%231baf7a'/%3E%3Crect x='10' y='8' width='5' height='7' rx='1.5' fill='%23eb6834'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --plane: #f4f4f1;
  --surface: #fcfcfb;
  --surface-2: #f6f6f3;
  --surface-3: #efeeea;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #898781;
  --hairline: #e1e0d9;
  --border: rgba(11, 11, 11, .10);
  --border-strong: rgba(11, 11, 11, .22);
  --resource: #2a78d6;
  --read: #1baf7a;
  --output: #eb6834;
  --neutral: #898781;
  --good: #0ca30c;
  --good-ink: #006300;
  --warning: #fab219;
  --critical: #d03b3b;
  --focus: #2a78d6;
  --shadow: 0 1px 2px rgba(11, 11, 11, .06), 0 8px 24px rgba(11, 11, 11, .08);
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #212120;
    --surface-3: #2a2a28;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --ink-3: #898781;
    --hairline: #2c2c2a;
    --border: rgba(255, 255, 255, .10);
    --border-strong: rgba(255, 255, 255, .24);
    --resource: #3987e5;
    --read: #199e70;
    --output: #d95926;
    --good-ink: #0ca30c;
    --focus: #5598e7;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #212120;
  --surface-3: #2a2a28;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --ink-3: #898781;
  --hairline: #2c2c2a;
  --border: rgba(255, 255, 255, .10);
  --border-strong: rgba(255, 255, 255, .24);
  --resource: #3987e5;
  --read: #199e70;
  --output: #d95926;
  --good-ink: #0ca30c;
  --focus: #5598e7;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .5);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--plane);
  color: var(--ink);
  font: 13px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.mono { font-family: var(--mono); font-size: 12px; }
svg.icon { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

#app { display: grid; grid-template-rows: auto 1fr; height: 100%; }

/* Top bar */
header.bar {
  display: flex; align-items: center; gap: 16px;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--hairline);
  min-width: 0;
}
.brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; white-space: nowrap; }
.brand b { font-size: 14px; letter-spacing: -.01em; }
.brand span { color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; }
.controls { display: flex; align-items: center; gap: 12px; margin-left: 8px; }
.field { display: flex; align-items: center; gap: 6px; color: var(--ink-3); white-space: nowrap; }
.segmented { display: inline-flex; padding: 2px; background: var(--surface-3); border-radius: 8px; }
.segmented button {
  border: 0; background: none; padding: 4px 10px; border-radius: 6px; color: var(--ink-2);
}
.segmented button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--border), 0 1px 2px rgba(0, 0, 0, .08); font-weight: 600; }
.search { position: relative; margin-left: auto; flex: 0 1 260px; min-width: 120px; }
.search input {
  width: 100%; padding: 6px 54px 6px 30px;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
}
.search input::placeholder { color: var(--ink-3); }
.search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
.search output { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); color: var(--ink-3); font-size: 11px; }
.live {
  display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px;
  border: 1px solid var(--border); border-radius: 999px; white-space: nowrap; color: var(--ink-2);
}
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
.live[data-state="building"] i { background: var(--warning); animation: pulse 1s ease-in-out infinite; }
.live[data-state="offline"] i, .live[data-state="failed"] i { background: var(--critical); }
@keyframes pulse { 50% { opacity: .35; } }
.ghost { border: 1px solid transparent; background: none; padding: 6px; border-radius: 8px; color: var(--ink-2); display: inline-flex; }
.ghost:hover { background: var(--surface-3); color: var(--ink); }
.ghost[aria-pressed="true"] { background: var(--surface-3); color: var(--ink); border-color: var(--border); }

/* Body */
main { display: grid; grid-template-columns: 264px minmax(0, 1fr) 340px; min-height: 0; }
aside { background: var(--surface); min-height: 0; overflow: auto; }
#outline { border-right: 1px solid var(--hairline); padding: 10px 6px 24px; }
#inspector { border-left: 1px solid var(--hairline); padding: 16px 16px 32px; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
#outline > .eyebrow { padding: 4px 10px 8px; }

/* Outline tree */
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree ul { margin-left: 13px; border-left: 1px solid var(--hairline); padding-left: 3px; }
.row {
  display: flex; align-items: center; gap: 6px; width: 100%;
  padding: 3px 6px; border: 0; background: none; border-radius: 6px; text-align: left; min-width: 0;
}
.row:hover { background: var(--surface-3); }
.row[aria-current="true"] { background: color-mix(in oklab, var(--resource) 14%, transparent); }
.row .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.row .count { color: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.row .label small { color: var(--ink-3); font: 11px var(--mono); margin-left: 6px; }
.row.dim { opacity: .38; }
.twist { width: 14px; height: 14px; flex: none; color: var(--ink-3); transition: transform .12s; }
li[aria-expanded="false"] > .row .twist { transform: rotate(-90deg); }
li[aria-expanded="false"] > ul { display: none; }
.dot { width: 9px; height: 9px; border-radius: 3px; flex: none; background: var(--neutral); }
.dot[data-kind="resource"] { background: var(--resource); }
.dot[data-kind="data"], .dot[data-kind="stack_reference"] { background: var(--read); }
.dot[data-kind="output"] { background: var(--output); }
.dot[data-kind="group"] { background: none; border: 1.5px solid var(--ink-3); }

/* Map */
#stage { display: grid; grid-template-rows: auto 1fr; min-width: 0; min-height: 0; }
#crumbs { display: flex; align-items: center; gap: 2px; padding: 8px 14px 0; min-height: 34px; color: var(--ink-3); overflow: hidden; white-space: nowrap; }
#crumbs button { border: 0; background: none; padding: 3px 6px; border-radius: 6px; color: var(--ink-2); }
#crumbs button:hover { background: var(--surface-3); color: var(--ink); }
#crumbs button:last-of-type { color: var(--ink); font-weight: 600; }
#crumbs .hint { margin-left: auto; font-size: 12px; }
#map { position: relative; margin: 8px 12px 12px; min-height: 0; overflow: hidden; }
.box {
  position: absolute; left: 0; top: 0; overflow: hidden;
  transition: transform .26s cubic-bezier(.2, .7, .2, 1), width .26s cubic-bezier(.2, .7, .2, 1), height .26s cubic-bezier(.2, .7, .2, 1), opacity .16s;
}
.box.entering { opacity: 0; }
.group { border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); }
.group[data-depth="0"] { background: var(--surface); border-radius: 12px; box-shadow: 0 1px 2px rgba(11, 11, 11, .04); }
.group[data-depth="2"], .group[data-depth="4"] { background: var(--surface); }
.group[data-depth="3"] { background: var(--surface-2); }
.group > .head {
  display: flex; align-items: center; gap: 6px; width: 100%; height: 22px; padding: 0 8px;
  border: 0; background: none; text-align: left; color: var(--ink-2); font-size: 12px; white-space: nowrap;
}
.group > .head:hover { color: var(--ink); }
.group > .head .label { overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.group > .head .sub { color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.group[data-depth="0"] > .head { height: 32px; padding: 0 12px; font-size: 13px; color: var(--ink); }
.group.collapsed { background: var(--surface-3); }
.group.selected { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 999px;
  border: 1px solid var(--border); color: var(--ink-2); font-size: 11px; font-weight: 500; white-space: nowrap; flex: none;
}
.chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }
.chip[data-tone="good"] i { background: var(--good); }
.chip[data-tone="warning"] i { background: var(--warning); }
.chip[data-tone="critical"] i { background: var(--critical); }
.chip[data-tone="building"] i { background: var(--warning); animation: pulse 1s ease-in-out infinite; }
.group .message {
  position: absolute; inset: 40px 12px 12px; overflow: auto; margin: 0; color: var(--ink-2);
  font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere;
}
.group .message.plain { font-family: var(--sans); font-size: 13px; display: grid; place-content: center; text-align: center; color: var(--ink-3); }

.tile {
  --c: var(--neutral);
  border: 1px solid color-mix(in oklab, var(--c) 38%, transparent);
  border-radius: 6px; padding: 0; text-align: left;
  background: color-mix(in oklab, var(--c) 13%, var(--surface));
}
.tile::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c); }
.tile[data-kind="resource"] { --c: var(--resource); }
.tile[data-kind="data"], .tile[data-kind="stack_reference"] { --c: var(--read); }
.tile[data-kind="output"] { --c: var(--output); }
.tile:hover, .tile.related { background: color-mix(in oklab, var(--c) 24%, var(--surface)); }
.tile.selected { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); background: color-mix(in oklab, var(--c) 28%, var(--surface)); }
.tile.related { border-color: var(--c); }
.tile .body { display: flex; flex-direction: column; gap: 1px; padding: 6px 8px 6px 11px; height: 100%; min-width: 0; }
.tile .top { display: flex; align-items: center; gap: 5px; min-width: 0; color: var(--ink-2); }
.tile .name {
  font-weight: 600; color: var(--ink); flex: 1; min-width: 0; overflow: hidden; overflow-wrap: anywhere; line-height: 1.25;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--lines, 1);
}
.tile .type { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 11px var(--mono); }
.tile .foot { margin-top: auto; color: var(--ink-3); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile[data-size="s"] .type, .tile[data-size="s"] .foot, .tile[data-size="xs"] .body { display: none; }
.tile[data-size="s"] .body { padding: 3px 5px 3px 8px; justify-content: center; font-size: 12px; }
.tile[data-narrow] .top > svg, .tile[data-narrow="tight"] .mark { display: none; }
.mark { width: 12px; height: 12px; flex: none; border-radius: 50%; }
.mark[data-applied="true"] { background: var(--good); display: grid; place-items: center; }
.mark[data-applied="true"]::after { content: ""; width: 5px; height: 3px; border: solid #fff; border-width: 0 0 1.5px 1.5px; transform: translateY(-1px) rotate(-45deg); }
.mark[data-applied="false"] { border: 1.5px dashed var(--ink-3); }
.dimmed .box.tile:not(.selected):not(.related):not(.inside), .dimmed .box.group.collapsed:not(.related) { opacity: .3; }
.filtered .box.tile:not(.match) { opacity: .22; }
#links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
#links path { fill: none; stroke: var(--ink); stroke-width: 1.5; }
#links path.halo { stroke: var(--surface); stroke-width: 4.5; opacity: .85; }
#links path[data-kind="provider"] { stroke: var(--ink-3); stroke-dasharray: 2 4; }
#links path[data-kind="stack"] { stroke-dasharray: 6 4; }
#links g.all path { stroke: var(--ink-3); stroke-width: 1; opacity: .55; }
#links marker path { fill: var(--ink); stroke: none; }
#links marker#arrow-muted path { fill: var(--ink-3); }
#links text { font: 600 10.5px var(--sans); fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }

#tip {
  position: fixed; z-index: 10; max-width: 320px; padding: 8px 10px; border-radius: 8px; pointer-events: none;
  background: var(--surface); border: 1px solid var(--border-strong); box-shadow: var(--shadow);
  opacity: 0; transition: opacity .1s;
}
#tip.on { opacity: 1; }
#tip b { display: block; overflow-wrap: anywhere; }
#tip span { display: block; color: var(--ink-2); overflow-wrap: anywhere; }

/* Inspector */
#inspector h2 { margin: 6px 0 2px; font-size: 18px; line-height: 1.25; letter-spacing: -.01em; overflow-wrap: anywhere; }
#inspector .address { color: var(--ink-2); overflow-wrap: anywhere; }
#inspector section { margin-top: 18px; }
#inspector section > .eyebrow { display: flex; justify-content: space-between; margin-bottom: 6px; }
.kind { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 12px; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 12px; margin: 14px 0 0; }
.facts dt { color: var(--ink-3); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.status { display: inline-flex; align-items: center; gap: 6px; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.link {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 8px; align-items: center; width: 100%;
  padding: 5px 8px; margin: 0 -8px; width: calc(100% + 16px); border: 0; background: none; border-radius: 6px; text-align: left;
}
.link:hover { background: var(--surface-3); }
.link .to { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link .via { grid-column: 2; color: var(--ink-3); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.args { width: 100%; border-collapse: collapse; table-layout: fixed; }
.args td { padding: 4px 0; border-top: 1px solid var(--hairline); vertical-align: top; overflow-wrap: anywhere; }
.args td:first-child { width: 44%; padding-right: 10px; color: var(--ink-2); }
.args tr:first-child td { border-top: 0; }
.ref { border: 0; padding: 0; background: none; color: inherit; text-decoration: underline; text-decoration-color: var(--ink-3); text-underline-offset: 2px; font: inherit; text-align: left; }
.ref:hover { text-decoration-color: var(--ink); }
.note { color: var(--ink-3); margin: 6px 0 0; }
.callout { margin-top: 12px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink-2); display: flex; gap: 8px; }
.callout svg { margin-top: 2px; color: var(--critical); }
.callout[data-tone="warning"] svg { color: var(--ink-2); }
pre.error { margin: 8px 0 0; padding: 10px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); font: 11.5px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow: auto; }
.legend { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; color: var(--ink-2); }
.legend li { display: flex; align-items: center; gap: 8px; }
.legend svg.line { width: 26px; height: 8px; flex: none; }
.legend svg.line path { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.stat { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-top: 1px solid var(--hairline); }
.stat:first-of-type { border-top: 0; }
.stat span:last-child { color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; }
kbd { font: 11px var(--mono); padding: 1px 5px; border: 1px solid var(--border-strong); border-radius: 4px; color: var(--ink-2); }

@media (max-width: 1100px) { main { grid-template-columns: minmax(0, 1fr) 320px; } #outline { display: none; } }
@media (max-width: 760px) {
  main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 42%); }
  #inspector { border-left: 0; border-top: 1px solid var(--hairline); }
  .controls .field > span, .brand span { display: none; }
}
@media (prefers-reduced-motion: reduce) { .box { transition: none; } .live i, .chip i { animation: none !important; } }
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand"><b>Inframe</b><span id="project"></span></div>
    <div class="controls">
      <label class="field"><span>Group by</span>
        <span class="segmented" id="group" role="group" aria-label="Group by">
          <button data-value="source">Source</button><button data-value="provider">Provider</button><button data-value="kind">Kind</button>
        </span></label>
      <label class="field"><span>Size</span>
        <span class="segmented" id="size" role="group" aria-label="Size by">
          <button data-value="config" title="Area follows how much configuration a node carries">Config</button><button data-value="equal" title="Every node the same area">Equal</button>
        </span></label>
      <button class="ghost" id="all-links" aria-pressed="false" title="Show every association at once">
        <svg class="icon" viewBox="0 0 16 16"><circle cx="3.5" cy="4" r="1.8"/><circle cx="12.5" cy="4" r="1.8"/><circle cx="8" cy="12.5" r="1.8"/><path d="M5.3 4h5.4M4.4 5.6l2.7 5.3M11.6 5.6l-2.7 5.3"/></svg>
      </button>
    </div>
    <div class="search">
      <svg class="icon" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
      <input id="search" type="search" placeholder="Filter nodes   /" aria-label="Filter nodes" autocomplete="off" spellcheck="false">
      <output id="matches"></output>
    </div>
    <div class="live" id="live" data-state="building" role="status"><i></i><span>Connecting…</span></div>
    <button class="ghost" id="theme" title="Switch theme" aria-label="Switch theme">
      <svg class="icon" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11" /><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg>
    </button>
  </header>
  <main>
    <aside id="outline" aria-label="Outline"></aside>
    <div id="stage">
      <nav id="crumbs" aria-label="Location"></nav>
      <div id="map"><svg id="links" aria-hidden="true">
        <defs>
          <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 .5 8 4 0 7.5z"/></marker>
          <marker id="arrow-muted" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 .5 8 4 0 7.5z"/></marker>
        </defs>
        <g class="all"></g><g class="active"></g>
      </svg></div>
    </div>
    <aside id="inspector" aria-label="Details" aria-live="polite"></aside>
  </main>
</div>
<div id="tip" role="tooltip"></div>

<script>
"use strict";
const $ = (selector) => document.querySelector(selector);
const el = (tag, attributes = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attributes)) {
    if (value == null || value === false) continue;
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value);
  }
  for (const child of children.flat()) if (child != null) node.append(child);
  return node;
};
const ICONS = {
  resource: '<path d="M8 1.8 13.5 5v6L8 14.2 2.5 11V5z"/><path d="M2.7 5.1 8 8.2l5.3-3.1M8 8.2v6"/>',
  data: '<circle cx="7" cy="7" r="4.3"/><path d="m10.2 10.2 3.3 3.3"/>',
  stack_reference: '<path d="M8 2 14 5 8 8 2 5z"/><path d="m2 8 6 3 6-3M2 11l6 3 6-3"/>',
  output: '<path d="M5 11 11.5 4.5M6 4.5h5.5V10"/>',
  provider: '<path d="M6 2v3M10 2v3M4 5h8v2.5a4 4 0 0 1-8 0zM8 11.5V14"/>',
  group: '<rect x="2" y="2.5" width="12" height="11" rx="2"/><path d="M2 6h12"/>',
  alert: '<path d="M8 2.2 14.3 13H1.7z"/><path d="M8 6.5v3M8 11.3v.2"/>',
  info: '<circle cx="8" cy="8" r="6"/><path d="M8 7.2v4M8 4.8v.2"/>',
  chevron: '<path d="m4 6 4 4 4-4"/>',
};
const icon = (name, cls = "icon") => {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", cls);
  svg.setAttribute("viewBox", "0 0 16 16");
  svg.innerHTML = ICONS[name] || ICONS.group;
  return svg;
};
const KIND_LABEL = { resource: "Resource", data: "Data source", stack_reference: "Stack reference", output: "Output", provider: "Provider configuration" };
const KIND_PLURAL = { resource: "Resources", data: "Data sources", stack_reference: "Stack references", output: "Outputs", provider: "Providers" };
const EDGE_VERB = { reference: "reads", depends_on: "depends on", replace_trigger: "is replaced with", provider: "is created through", stack: "reads" };
const plural = (count, one, many) => `${count} ${count === 1 ? one : many}`;
const stored = (key, fallback) => { try { return localStorage.getItem(key) || fallback; } catch { return fallback; } };
const store = (key, value) => { try { localStorage.setItem(key, value); } catch { /* private window */ } };

const ui = {
  model: null, nodes: new Map(), out: new Map(), into: new Map(), edges: [],
  group: stored("inframe.group", "source"), size: stored("inframe.size", "config"),
  focus: "root", selected: null, hovered: null, query: "", allLinks: false,
  tree: null, byId: new Map(), parent: new Map(), items: new Map(), anchors: new Map(),
  closed: new Set(), connected: false, appliedStacks: new Set(),
};

/* ---------- model → hierarchy ---------- */

function ingest(model) {
  ui.model = model;
  ui.nodes.clear(); ui.out.clear(); ui.into.clear(); ui.edges = [];
  // Applied marks only say something where a stack is partly applied or has drifted.
  ui.appliedStacks = new Set(model.stacks.filter((stack) => stack.nodes.some((node) => node.applied)).map((stack) => stack.name));
  for (const stack of model.stacks) {
    for (const node of stack.nodes) { node.stack = stack.name; ui.nodes.set(node.id, node); }
    for (const edge of stack.edges) ui.edges.push(edge);
  }
  for (const edge of ui.edges) {
    if (!ui.nodes.has(edge.from) || !ui.nodes.has(edge.to)) continue;
    (ui.out.get(edge.from) || ui.out.set(edge.from, []).get(edge.from)).push(edge);
    (ui.into.get(edge.to) || ui.into.set(edge.to, []).get(edge.to)).push(edge);
  }
  rebuild();
}

const group = (id, label, extra = {}) => ({ id, label, children: [], container: true, ...extra });

/* Source: module path (shared prefixes folded) → declaration → node. */
function bySource(stack, parent) {
  const modules = new Map();
  const loose = [];
  for (const node of stack.nodes) {
    if (!node.origin) { loose.push(node); continue; }
    const trail = node.origin.module.split(".");
    let level = modules, at = null, path = "";
    for (const segment of trail) {
      path = path ? `${path}.${segment}` : segment;
      if (!level.has(segment)) level.set(segment, { path, segment, modules: new Map(), nodes: [] });
      at = level.get(segment); level = at.modules;
    }
    at.nodes.push(node);
  }
  const emit = (entry, into, label) => {
    // A module that only holds one submodule folds into it: `Infra` + `Platform` → `Infra.Platform`.
    if (!entry.nodes.length && entry.modules.size === 1) {
      const [only] = entry.modules.values();
      return emit(only, into, `${label}.${only.segment}`);
    }
    const module = group(`${parent.id}/m:${entry.path}`, label, { sub: "module", icon: "group" });
    const declarations = new Map();
    for (const node of entry.nodes) {
      const name = node.origin.declaration;
      if (!name) { module.children.push(leaf(node)); continue; }
      if (!declarations.has(name)) declarations.set(name, group(`${module.id}/d:${name}`, name.split(".").pop(), { sub: "def", full: name, icon: "group" }));
      declarations.get(name).children.push(leaf(node));
    }
    module.children.push(...declarations.values());
    for (const child of entry.modules.values()) emit(child, module, child.segment);
    into.children.push(module);
  };
  for (const entry of modules.values()) emit(entry, parent, entry.segment);
  if (loose.length) {
    if (!modules.size) byProvider({ ...stack, nodes: loose }, parent);
    else {
      const rest = group(`${parent.id}/m:`, "No recorded origin", { sub: "", icon: "group" });
      rest.children = loose.map(leaf);
      parent.children.push(rest);
    }
  }
}

function byProvider(stack, parent) {
  const providers = new Map();
  const others = new Map();
  for (const node of stack.nodes) {
    if (node.kind === "output" || node.kind === "stack_reference") {
      const key = node.kind;
      if (!others.has(key)) others.set(key, group(`${parent.id}/k:${key}`, KIND_PLURAL[key], { icon: "group" }));
      others.get(key).children.push(leaf(node));
      continue;
    }
    const name = node.provider || "unknown";
    if (!providers.has(name)) providers.set(name, { box: group(`${parent.id}/p:${name}`, name, { sub: "provider", icon: "group" }), types: new Map() });
    const provider = providers.get(name);
    if (node.kind === "provider") { provider.box.children.push(leaf(node)); continue; }
    const type = (node.kind === "data" ? "data." : "") + node.type;
    if (!provider.types.has(type)) provider.types.set(type, []);
    provider.types.get(type).push(node);
  }
  for (const { box, types } of providers.values()) {
    for (const [type, nodes] of types) {
      if (nodes.length === 1) { box.children.push(leaf(nodes[0])); continue; }
      const typed = group(`${box.id}/t:${type}`, type.replace(new RegExp(`^(data\\.)?${box.label}_`), "$1"), { sub: "type", icon: "group" });
      typed.children = nodes.map(leaf);
      box.children.push(typed);
    }
    parent.children.push(box);
  }
  parent.children.push(...others.values());
}

function byKind(stack, parent) {
  const kinds = new Map();
  for (const node of stack.nodes) {
    if (!kinds.has(node.kind)) kinds.set(node.kind, group(`${parent.id}/k:${node.kind}`, KIND_PLURAL[node.kind], { icon: "group" }));
    kinds.get(node.kind).children.push(leaf(node));
  }
  for (const kind of ["resource", "data", "stack_reference", "output", "provider"]) if (kinds.has(kind)) parent.children.push(kinds.get(kind));
}

/* Let a long identifier wrap after its separators before it is cut mid-word. */
const breakable = (text) => text.split(/(?<=[_.\-])/).flatMap((part, index) => index ? [document.createElement("wbr"), part] : [part]);

const leaf = (node) => ({ id: node.id, label: node.name, node, weight: ui.size === "equal" ? 4 : Math.max(3, node.weight) });

function rebuild() {
  const root = group("root", ui.model.project.name || "Project", { root: true });
  for (const stack of ui.model.stacks) {
    const box = group(`s:${stack.name}`, stack.name, { stack, icon: "stack_reference" });
    if (ui.group === "source") bySource(stack, box);
    else if (ui.group === "provider") byProvider(stack, box);
    else byKind(stack, box);
    root.children.push(box);
  }
  ui.byId.clear(); ui.parent.clear();
  const visit = (item, parent) => {
    ui.byId.set(item.id, item);
    if (parent) ui.parent.set(item.id, parent);
    if (!item.container) { item.ids = [item.id]; return item.weight; }
    item.ids = [];
    item.weight = 0;
    for (const child of item.children) { item.weight += visit(child, item); item.ids.push(...child.ids); }
    item.children.sort((a, b) => b.weight - a.weight || a.label.localeCompare(b.label));
    return item.weight;
  };
  visit(root, null);
  // A stack with nothing to show still gets a card large enough to read its status.
  const floor = Math.max(8, root.weight * 0.14);
  for (const stack of root.children) if (!stack.children.length) stack.weight = floor;
  root.weight = root.children.reduce((sum, stack) => sum + stack.weight, 0);
  ui.tree = root;
  if (!ui.byId.has(ui.focus)) ui.focus = "root";
  if (ui.selected && !ui.byId.has(ui.selected)) ui.selected = null;
  renderAll();
}

/* ---------- layout ---------- */

function squarify(children, x, y, width, height) {
  const total = children.reduce((sum, child) => sum + child.weight, 0);
  const rects = [];
  if (total <= 0 || width <= 0 || height <= 0) return rects;
  const scale = (width * height) / total;
  let row = [], rowArea = 0, index = 0;
  const worst = (areas, sum, side) => {
    const max = Math.max(...areas), min = Math.min(...areas);
    return Math.max((side * side * max) / (sum * sum), (sum * sum) / (side * side * min));
  };
  const flush = () => {
    const side = Math.min(width, height);
    const thickness = rowArea / side;
    let offset = 0;
    for (const { child, area } of row) {
      const length = area / thickness;
      rects.push(width >= height
        ? { child, x, y: y + offset, w: thickness, h: length }
        : { child, x: x + offset, y, w: length, h: thickness });
      offset += length;
    }
    if (width >= height) { x += thickness; width -= thickness; } else { y += thickness; height -= thickness; }
    row = []; rowArea = 0;
  };
  while (index < children.length) {
    const child = children[index];
    const area = child.weight * scale;
    const side = Math.min(width, height);
    const areas = row.map((entry) => entry.area);
    if (!row.length || worst([...areas, area], rowArea + area, side) <= worst(areas, rowArea, side)) {
      row.push({ child, area }); rowArea += area; index += 1;
    } else flush();
  }
  if (row.length) flush();
  return rects;
}

function layout() {
  const map = $("#map");
  const width = map.clientWidth, height = map.clientHeight;
  const focus = ui.byId.get(ui.focus);
  const placed = [];
  ui.anchors.clear();
  const place = (item, rect, depth, hidden) => {
    const gap = depth === 0 ? 5 : 2.5;
    const box = { item, x: rect.x + gap, y: rect.y + gap, w: Math.max(0, rect.w - 2 * gap), h: Math.max(0, rect.h - 2 * gap), depth };
    if (!item.container) {
      placed.push(box);
      ui.anchors.set(item.id, box);
      return;
    }
    const head = depth === 0 ? 32 : 22, pad = depth === 0 ? 5 : 3;
    const inner = { x: box.x + pad, y: box.y + head, w: box.w - 2 * pad, h: box.h - head - pad };
    box.collapsed = item.children.length > 0 && (inner.w < 34 || inner.h < 22);
    // A group too small to open that holds one node shows the node instead of a blank box.
    if (box.collapsed && item.ids.length === 1) return place(ui.byId.get(item.ids[0]), rect, depth, false);
    if (!hidden) placed.push(box);
    if (box.collapsed || !item.children.length) {
      for (const id of item.ids) ui.anchors.set(id, box);
      return;
    }
    for (const rect of squarify(item.children, inner.x, inner.y, inner.w, inner.h)) place(rect.child, rect, depth + 1, false);
  };
  if (focus.root) {
    for (const rect of squarify(focus.children, 0, 0, width, height)) place(rect.child, rect, 0, false);
  } else if (focus.container) {
    place(focus, { x: 0, y: 0, w: width, h: height }, 0, false);
  }
  return placed;
}

/* ---------- rendering ---------- */

function stackChips(stack) {
  const chips = [];
  if (stack.status === "building") chips.push(el("span", { class: "chip", "data-tone": "building" }, el("i"), "Building"));
  else if (stack.status === "failed") chips.push(el("span", { class: "chip", "data-tone": "critical" }, el("i"), stack.nodes.length ? "Build failed · showing last good" : "Build failed"));
  if (stack.state.tracked && stack.nodes.length) {
    const tracked = stack.nodes.filter((node) => node.applied != null);
    const applied = tracked.filter((node) => node.applied).length;
    chips.push(el("span", { class: "chip", "data-tone": applied === tracked.length ? "good" : undefined, title: "Nodes present in the stack's state" }, el("i"), `${applied}/${tracked.length} applied`));
  }
  if (stack.unmanaged.length) chips.push(el("span", { class: "chip", "data-tone": "warning", title: "In the state but no longer declared" }, el("i"), `${stack.unmanaged.length} to destroy`));
  return chips;
}

function drawBox(box, existing) {
  const { item } = box;
  let node = existing;
  if (!node) {
    node = item.container ? el("div", { class: "box group entering" }) : el("button", { class: "box tile entering", type: "button" });
    node.dataset.id = item.id;
    node.addEventListener("pointerenter", (event) => hover(item.id, event));
    node.addEventListener("pointermove", moveTip);
    node.addEventListener("pointerleave", () => hover(null));
    requestAnimationFrame(() => node.classList.remove("entering"));
  }
  node.style.transform = `translate(${box.x}px, ${box.y}px)`;
  node.style.width = `${box.w}px`;
  node.style.height = `${box.h}px`;
  node.style.zIndex = box.depth;
  const signature = JSON.stringify([item.label, item.sub, box.collapsed, item.ids.length, item.stack && [item.stack.status, item.stack.error, item.stack.state, item.stack.unmanaged.length, item.stack.nodes.map((n) => n.applied)],
    item.node && [item.node.type, item.node.applied, ui.appliedStacks.has(item.node.stack), item.node.origin, item.node.arguments.length], Math.round(box.w / 8), Math.round(box.h / 8), box.depth, ui.group]);
  if (node.dataset.signature === signature) return node;
  node.dataset.signature = signature;
  node.replaceChildren();
  if (item.container) {
    node.dataset.depth = Math.min(box.depth, 4);
    node.classList.toggle("collapsed", Boolean(box.collapsed));
    if (box.h >= 20 && box.w >= 40) {
      const head = el("button", { class: "head", type: "button", title: `${item.full || item.label}${box.collapsed ? " · open" : " · double-click to zoom in"}`,
        onclick: () => box.collapsed ? zoom(item.id) : select(item.id), ondblclick: () => zoom(item.id) },
        el("span", { class: "label", text: item.label }),
        item.stack ? el("span", { class: "sub", text: `${item.stack.frontend} · ${plural(item.ids.length, "node", "nodes")}` })
          : el("span", { class: "sub", text: box.w > 150 ? [item.sub, item.ids.length > 1 ? item.ids.length : ""].filter(Boolean).join(" · ") : "" }),
        item.stack && box.w > 330 ? stackChips(item.stack) : null);
      node.append(head);
    }
    if (item.stack && !item.children.length) {
      const { stack } = item;
      node.append(stack.error
        ? el("pre", { class: "message", text: stack.error })
        : el("p", { class: "message plain", text: stack.status === "building" ? "Building…" : "This stack declares nothing." }));
    }
  } else {
    const data = item.node;
    node.dataset.kind = data.kind;
    const size = box.w < 30 || box.h < 20 ? "xs" : box.w < 104 || box.h < 50 ? "s" : "m";
    node.dataset.size = size;
    if (box.w < 64) node.dataset.narrow = "tight"; else if (box.w < 112) node.dataset.narrow = "icon"; else delete node.dataset.narrow;
    node.style.setProperty("--lines", size === "s" ? Math.max(1, Math.min(4, Math.floor((box.h - 8) / 15))) : box.h >= 96 ? 2 : 1);
    const shortType = data.provider && data.type.startsWith(`${data.provider}_`) ? data.type.slice(data.provider.length + 1) : data.type;
    const showMark = data.applied != null && ui.appliedStacks.has(data.stack);
    node.setAttribute("aria-label", `${KIND_LABEL[data.kind]} ${data.address}`);
    const foot = ui.group === "source" || !data.origin
      ? plural(data.arguments.length + (data.hidden_arguments || 0), "argument", "arguments")
      : `${data.origin.module}${data.origin.declaration ? " › " + data.origin.declaration : ""}`;
    node.append(el("span", { class: "body" },
      el("span", { class: "top" }, icon(data.kind), el("span", { class: "name" }, breakable(data.name)),
        showMark ? el("span", { class: "mark", "data-applied": String(data.applied) }) : null),
      el("span", { class: "type", text: data.kind === "output" ? "output" : data.kind === "stack_reference" ? "stack" : data.kind === "data" ? `data.${shortType}` : shortType }),
      box.h >= 64 ? el("span", { class: "foot", text: foot }) : null));
    node.onclick = () => select(item.id);
  }
  return node;
}

function renderMap() {
  const map = $("#map");
  const placed = layout();
  const existing = new Map([...map.querySelectorAll(".box")].map((node) => [node.dataset.id, node]));
  ui.items.clear();
  for (const box of placed) {
    const node = drawBox(box, existing.get(box.item.id));
    existing.delete(box.item.id);
    ui.items.set(box.item.id, { box, node });
    if (!node.isConnected) map.insertBefore(node, $("#links"));
  }
  for (const node of existing.values()) node.remove();
  $("#links").style.zIndex = 9;
  decorate();
}

/* Selection state, filter matches, and the association lines. */
function decorate() {
  const map = $("#map");
  const selection = ui.selected && ui.byId.get(ui.selected);
  const inside = new Set(selection ? selection.ids : []);
  const related = new Set();
  if (selection) for (const id of inside) {
    for (const edge of ui.out.get(id) || []) if (!inside.has(edge.to)) related.add(edge.to);
    for (const edge of ui.into.get(id) || []) if (!inside.has(edge.from)) related.add(edge.from);
  }
  const query = ui.query.trim().toLowerCase();
  let matches = 0;
  const matching = new Set();
  if (query) for (const node of ui.nodes.values()) {
    if (haystack(node).includes(query)) { matching.add(node.id); matches += 1; }
  }
  ui.matching = query ? matching : null;
  map.classList.toggle("dimmed", Boolean(selection));
  map.classList.toggle("filtered", Boolean(query));
  for (const [id, { box, node }] of ui.items) {
    const item = box.item;
    node.classList.toggle("selected", id === ui.selected);
    node.classList.toggle("inside", Boolean(selection) && id !== ui.selected && !item.container && inside.has(id));
    node.classList.toggle("related", item.container ? box.collapsed && item.ids.some((member) => related.has(member)) : related.has(id));
    if (!item.container) node.classList.toggle("match", matching.has(id));
  }
  $("#matches").textContent = query ? `${matches}` : "";
  drawLinks();
  for (const row of document.querySelectorAll("#outline .row")) {
    row.setAttribute("aria-current", String(row.dataset.id === ui.selected));
    row.classList.toggle("dim", Boolean(query) && !ui.byId.get(row.dataset.id).ids.some((id) => matching.has(id)));
  }
}

const haystack = (node) => node.search || (node.search = [node.address, node.type, node.stack, node.origin && node.origin.module, node.origin && node.origin.declaration,
  ...node.arguments.flatMap((argument) => [argument.name, argument.value])].filter(Boolean).join("\n").toLowerCase());

function border(box, towardX, towardY) {
  const cx = box.x + box.w / 2, cy = box.y + box.h / 2;
  const dx = towardX - cx, dy = towardY - cy;
  if (!dx && !dy) return [cx, cy];
  const scale = Math.min(dx ? (box.w / 2) / Math.abs(dx) : Infinity, dy ? (box.h / 2) / Math.abs(dy) : Infinity);
  return [cx + dx * scale, cy + dy * scale];
}

function drawLinks() {
  const svg = $("#links");
  const active = svg.querySelector("g.active"), all = svg.querySelector("g.all");
  active.replaceChildren(); all.replaceChildren();
  const ns = "http://www.w3.org/2000/svg";
  const path = (parent, a, b, kind, muted, label) => {
    const [x1, y1] = border(a, b.x + b.w / 2, b.y + b.h / 2);
    const [x2, y2] = border(b, a.x + a.w / 2, a.y + a.h / 2);
    const dx = x2 - x1, dy = y2 - y1, length = Math.hypot(dx, dy) || 1;
    const bow = Math.min(46, length * 0.16);
    const mx = (x1 + x2) / 2 - (dy / length) * bow, my = (y1 + y2) / 2 + (dx / length) * bow;
    const d = `M${x1.toFixed(1)} ${y1.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`;
    if (!muted) { const halo = document.createElementNS(ns, "path"); halo.setAttribute("d", d); halo.setAttribute("class", "halo"); parent.append(halo); }
    const line = document.createElementNS(ns, "path");
    line.setAttribute("d", d); line.dataset.kind = kind;
    line.setAttribute("marker-end", muted ? "url(#arrow-muted)" : "url(#arrow)");
    parent.append(line);
    if (label) {
      const text = document.createElementNS(ns, "text");
      text.setAttribute("x", ((x1 + 2 * mx + x2) / 4).toFixed(1)); text.setAttribute("y", ((y1 + 2 * my + y2) / 4 + 3.5).toFixed(1));
      text.setAttribute("text-anchor", "middle"); text.textContent = label;
      parent.append(text);
    }
  };
  if (ui.allLinks) {
    const seen = new Set();
    for (const edge of ui.edges) {
      if (edge.kind === "provider") continue;
      const a = ui.anchors.get(edge.from), b = ui.anchors.get(edge.to);
      if (!a || !b || a === b) continue;
      const key = `${a.item.id}>${b.item.id}`;
      if (seen.has(key)) continue;
      seen.add(key);
      path(all, a, b, edge.kind, true);
    }
  }
  const subject = ui.byId.get(ui.hovered || ui.selected);
  if (!subject || subject.root) return;
  const inside = new Set(subject.ids);
  const own = subject.container ? (ui.items.get(subject.id) || {}).box : null;
  const lines = new Map();
  const add = (edge, outward) => {
    const near = own || ui.anchors.get(outward ? edge.from : edge.to);
    const far = ui.anchors.get(outward ? edge.to : edge.from);
    if (!near || !far || near === far) return;
    const key = `${outward}|${near.item.id}|${far.item.id}|${edge.kind === "provider"}`;
    if (!lines.has(key)) lines.set(key, { from: outward ? near : far, to: outward ? far : near, kind: edge.kind, via: [], count: 0 });
    const line = lines.get(key);
    line.count += 1; line.via.push(...(edge.via || []));
  };
  for (const id of inside) {
    for (const edge of ui.out.get(id) || []) if (!inside.has(edge.to)) add(edge, true);
    for (const edge of ui.into.get(id) || []) if (!inside.has(edge.from)) add(edge, false);
  }
  const labelled = lines.size <= 7;
  for (const line of lines.values()) {
    const label = !labelled || line.kind === "provider" ? "" : line.count > 1 ? `${line.count} links` : (line.via[0] || "").split(" → ")[0];
    path(active, line.from, line.to, line.kind, false, label.length > 34 ? `${label.slice(0, 33)}…` : label);
  }
}

function renderCrumbs() {
  const crumbs = $("#crumbs");
  const trail = [];
  for (let item = ui.byId.get(ui.focus); item; item = ui.parent.get(item.id)) trail.unshift(item);
  crumbs.replaceChildren();
  trail.forEach((item, index) => {
    if (index) crumbs.append(el("span", { text: "›", "aria-hidden": "true" }));
    crumbs.append(el("button", { type: "button", text: item.label, onclick: () => zoom(item.id) }));
  });
  crumbs.append(el("span", { class: "hint" }, trail.length > 1 ? el("span", {}, el("kbd", { text: "Esc" }), " to zoom out") : "Double-click a group to zoom in"));
}

function renderOutline() {
  const outline = $("#outline");
  const scroll = outline.scrollTop;
  const branch = (item) => {
    const row = el("button", { class: "row", type: "button", "data-id": item.id, title: item.node ? item.node.address : item.label,
      onclick: () => { if (item.container && !item.root) reveal(item.id); select(item.id); },
      ondblclick: () => item.container && zoom(item.id) });
    if (item.container) {
      row.append(el("span", { class: "twist", onclick: (event) => { event.stopPropagation(); toggle(item.id); } }, icon("chevron", "icon twist")),
        el("span", { class: "dot", "data-kind": "group" }), el("span", { class: "label", text: item.label }),
        el("span", { class: "count", text: String(item.ids.length) }));
      const li = el("li", { "aria-expanded": String(!ui.closed.has(item.id)) }, row);
      if (item.children.length) li.append(el("ul", {}, item.children.map(branch)));
      return li;
    }
    row.append(el("span", { class: "twist" }), el("span", { class: "dot", "data-kind": item.node.kind }),
      el("span", { class: "label" }, item.label, ui.group === "provider" || !item.node.type || item.node.kind === "provider" ? null
        : el("small", { text: item.node.kind === "stack_reference" ? "stack" : item.node.type.replace(new RegExp(`^${item.node.provider}_`), "") })));
    return el("li", {}, row);
  };
  outline.replaceChildren(el("div", { class: "eyebrow", text: "Outline" }), el("ul", { class: "tree" }, ui.tree.children.map(branch)));
  outline.scrollTop = scroll;
}

function toggle(id) {
  if (ui.closed.has(id)) ui.closed.delete(id); else ui.closed.add(id);
  renderOutline(); decorate();
}

/* ---------- inspector ---------- */

const section = (title, count, ...children) => el("section", {}, el("div", { class: "eyebrow" }, el("span", { text: title }), count == null ? null : el("span", { text: String(count) })), ...children);

function linkRow(node, via) {
  return el("li", {}, el("button", { class: "link", type: "button", title: node.id,
    onclick: () => select(node.id, true), onpointerenter: () => hover(node.id), onpointerleave: () => hover(null) },
    el("span", { class: "dot", "data-kind": node.kind }),
    el("span", { class: "to mono", text: (node.stack !== (ui.nodes.get(ui.selected) || {}).stack && ui.nodes.has(ui.selected) ? `${node.stack} · ` : "") + node.address }),
    via ? el("span", { class: "via", text: via }) : null));
}

function appliedStatus(node, stack) {
  if (node.applied == null) return node.kind === "provider" || node.kind === "stack_reference" ? null : el("span", { class: "status", title: stack.state.reason || "" }, "Not tracked");
  return el("span", { class: "status" }, el("span", { class: "mark", "data-applied": String(node.applied) }), node.applied ? "Applied" : "Not applied yet");
}

function valueCell(argument) {
  const cell = el("td", { class: "mono" });
  if (!argument.references || !argument.references.length) { cell.textContent = argument.value; return cell; }
  // Make each referenced address inside the printed value a link to its node.
  let rest = argument.value;
  const targets = argument.references.map((id) => ui.nodes.get(id)).filter(Boolean).sort((a, b) => b.address.length - a.address.length);
  while (rest) {
    let first = null;
    for (const target of targets) {
      const at = rest.indexOf(target.address);
      if (at >= 0 && (!first || at < first.at)) first = { at, target };
    }
    if (!first) { cell.append(rest); break; }
    cell.append(rest.slice(0, first.at), el("button", { class: "ref", type: "button", text: first.target.address, onclick: () => select(first.target.id, true) }));
    rest = rest.slice(first.at + first.target.address.length);
  }
  return cell;
}

function inspectNode(node) {
  const stack = ui.model.stacks.find((candidate) => candidate.name === node.stack);
  const out = ui.out.get(node.id) || [], into = ui.into.get(node.id) || [];
  const describe = (edge) => edge.kind === "reference" || edge.kind === "stack" ? (edge.via || []).join(", ") : EDGE_VERB[edge.kind];
  const facts = el("dl", { class: "facts" });
  const fact = (name, value) => value && facts.append(el("dt", { text: name }), el("dd", {}, value));
  fact("Stack", node.stack);
  fact("State", appliedStatus(node, stack));
  if (node.origin) fact("Declared in", el("span", { class: "mono", text: `${node.origin.module}${node.origin.declaration ? " › " + node.origin.declaration : ""}${node.origin.line ? `  :${node.origin.line}` : ""}` }));
  else fact("Declared in", el("span", { class: "note", text: stack.has_origins ? "No origin recorded" : `The ${stack.frontend} frontend does not record origins` }));
  if (node.kind === "resource" || node.kind === "data") fact("Type", el("span", { class: "mono", text: node.type }));
  if (node.kind === "provider") fact("Source", el("span", { class: "mono", text: node.type }));
  return [
    el("span", { class: "kind" }, icon(node.kind), KIND_LABEL[node.kind]),
    el("h2", { text: node.name }),
    el("div", { class: "address mono", text: node.address }),
    node.flags && node.flags.length ? el("div", { class: "badges" }, node.flags.map((flag) => el("span", { class: "chip", text: flag }))) : null,
    facts,
    section("Depends on", out.length, out.length
      ? el("ul", { class: "list" }, out.map((edge) => linkRow(ui.nodes.get(edge.to), describe(edge))))
      : el("p", { class: "note", text: "Nothing: this node can be created first." })),
    section("Used by", into.length, into.length
      ? el("ul", { class: "list" }, into.map((edge) => linkRow(ui.nodes.get(edge.from), describe(edge))))
      : el("p", { class: "note", text: "Nothing reads this node." })),
    node.kind === "stack_reference" ? null : section(node.kind === "output" ? "Value" : "Configuration", node.kind === "output" ? null : node.arguments.length + (node.hidden_arguments || 0),
      node.arguments.length ? el("table", { class: "args" }, el("tbody", {}, node.arguments.map((argument) => el("tr", {}, el("td", { class: "mono", text: node.kind === "output" ? argument.name.replace(/^value\.?/, "") || "value" : argument.name }), valueCell(argument)))))
        : el("p", { class: "note", text: "No arguments set." }),
      node.hidden_arguments ? el("p", { class: "note", text: `${node.hidden_arguments} more not shown.` }) : null),
  ];
}

function inspectGroup(item) {
  const inside = new Set(item.ids);
  const members = item.ids.map((id) => ui.nodes.get(id));
  const counts = new Map();
  for (const node of members) counts.set(node.kind, (counts.get(node.kind) || 0) + 1);
  const outward = new Map(), inward = new Map();
  const owner = (id) => {
    // The sibling-level group the other end lives in, so associations read module to module.
    let other = ui.byId.get(id);
    for (let up = ui.parent.get(other.id); up; up = ui.parent.get(up.id)) {
      if (up.ids.some((member) => inside.has(member))) break;
      other = up;
    }
    return other;
  };
  for (const id of inside) {
    for (const edge of ui.out.get(id) || []) if (!inside.has(edge.to) && edge.kind !== "provider") { const o = owner(edge.to); outward.set(o, (outward.get(o) || 0) + 1); }
    for (const edge of ui.into.get(id) || []) if (!inside.has(edge.from) && edge.kind !== "provider") { const o = owner(edge.from); inward.set(o, (inward.get(o) || 0) + 1); }
  }
  const rows = (entries) => el("ul", { class: "list" }, [...entries].sort((a, b) => b[1] - a[1]).map(([other, count]) =>
    el("li", {}, el("button", { class: "link", type: "button", onclick: () => select(other.id, true), onpointerenter: () => hover(other.id), onpointerleave: () => hover(null) },
      el("span", { class: "dot", "data-kind": other.node ? other.node.kind : "group" }),
      el("span", { class: "to", text: other.node ? other.node.address : other.label }),
      el("span", { class: "via", text: [other.node ? KIND_LABEL[other.node.kind] : other.stack ? "stack" : other.sub === "def" ? `definition in ${trail(ui.parent.get(other.id))}` : other.sub === "module" ? "module" : "group",
        plural(count, "association", "associations")].join(" · ") })))));
  const parts = [
    el("span", { class: "kind" }, icon("group"), item.stack ? "Stack" : item.sub === "def" ? "Definition" : item.sub === "module" ? "Module" : "Group"),
    el("h2", { text: item.full || item.label }),
    el("div", { class: "address", text: item.stack ? `${item.stack.frontend} frontend · ${item.stack.backend} backend${item.stack.gated ? " · gated" : ""}` : trail(item) }),
  ];
  if (item.stack) parts.push(...stackDetails(item.stack));
  parts.push(section("Contains", item.ids.length, [...counts].map(([kind, count]) => el("div", { class: "stat" }, el("span", { class: "kind" }, icon(kind), KIND_PLURAL[kind]), el("span", { text: String(count) })))),
    section("Depends on", outward.size, outward.size ? rows(outward) : el("p", { class: "note", text: "Nothing outside this group." })),
    section("Used by", inward.size, inward.size ? rows(inward) : el("p", { class: "note", text: "Nothing outside this group." })));
  return parts;
}

const trail = (item) => { const names = []; for (let at = item; at && !at.root; at = ui.parent.get(at.id)) names.unshift(at.label); return names.join(" › "); };
const clock = (ms) => new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });

function stackDetails(stack) {
  const parts = [];
  if (stack.error) parts.push(el("div", { class: "callout" }, icon("alert"), el("div", {}, stack.nodes.length ? "The last build failed. The nodes shown are from the last build that succeeded." : "This stack has not built yet.")), el("pre", { class: "error", text: stack.error }));
  const facts = el("dl", { class: "facts" });
  const fact = (name, value) => facts.append(el("dt", { text: name }), el("dd", { text: value }));
  if (stack.built_at_ms) fact("Built", `${clock(stack.built_at_ms)} in ${(stack.build_ms / 1000).toFixed(1)}s`);
  fact("State", !stack.state.tracked ? stack.state.reason : stack.state.serial == null ? "Nothing applied yet" : `Serial ${stack.state.serial}, written ${new Date(stack.state.updated_ms).toLocaleString()}`);
  if (!stack.has_origins && stack.nodes.length) fact("Source", `The ${stack.frontend} frontend does not record where nodes are declared, so this stack is grouped by provider.`);
  parts.push(facts);
  if (stack.unmanaged.length) parts.push(section("In state, no longer declared", stack.unmanaged.length,
    el("div", { class: "callout", "data-tone": "warning" }, icon("info"), el("div", { text: "The next apply destroys these." })),
    el("ul", { class: "list" }, stack.unmanaged.map((address) => el("li", { class: "mono", text: address, style: "padding:3px 0" })))));
  return parts;
}

function overview() {
  const { model } = ui;
  const line = (d) => { const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.setAttribute("class", "line"); svg.setAttribute("viewBox", "0 0 26 8"); svg.innerHTML = `<path d="M1 4h22" ${d}/><path d="m20 1 4 3-4 3" />`; return svg; };
  const tracked = ui.appliedStacks.size > 0;
  return [
    el("span", { class: "eyebrow", text: "Project" }),
    el("h2", { text: model.project.name }),
    el("div", { class: "address mono", text: model.project.root }),
    model.project.error ? el("div", { class: "callout" }, icon("alert"), el("div", {}, "inframe.toml could not be read; showing its last readable version.", el("pre", { class: "error", text: model.project.error }))) : null,
    section("Stacks", model.stacks.length, model.stacks.map((stack) => el("button", { class: "link", type: "button", onclick: () => select(`s:${stack.name}`) },
      el("span", { class: "dot", "data-kind": "group" }), el("span", { class: "to", text: stack.name }),
      el("span", { class: "via", text: stack.status === "building" ? "Building…" : stack.status === "failed" && !stack.nodes.length ? "Build failed" : `${plural(stack.nodes.length, "node", "nodes")} · ${plural(stack.edges.length, "association", "associations")}${stack.status === "failed" ? " · last build failed" : ""}` })))),
    section("Reading the map", null, el("ul", { class: "legend" },
      el("li", {}, el("span", { class: "dot", "data-kind": "resource" }), icon("resource"), "Managed resource"),
      el("li", {}, el("span", { class: "dot", "data-kind": "data" }), icon("data"), "Data source, or another stack read"),
      el("li", {}, el("span", { class: "dot", "data-kind": "output" }), icon("output"), "Root output"),
      el("li", {}, el("span", { class: "dot" }), icon("provider"), "Provider configuration"),
      tracked ? el("li", {}, el("span", { class: "mark", "data-applied": "true" }), "In the stack's state") : null,
      tracked ? el("li", {}, el("span", { class: "mark", "data-applied": "false" }), "Declared, not applied yet") : null,
      el("li", {}, line(""), "Points at what a node needs"),
      el("li", {}, line('stroke-dasharray="2 3"'), "Created through a provider"))),
    section("Tips", null, el("p", { class: "note", style: "margin:0" }, "Boxes nest the way the stack is written: stack, module, definition, node. Select anything to see what it depends on and what uses it; ", el("kbd", { text: "/" }), " filters, ", el("kbd", { text: "Esc" }), " steps back.")),
  ];
}

function renderInspector() {
  const inspector = $("#inspector");
  const item = ui.selected && ui.byId.get(ui.selected);
  const scroll = inspector.dataset.for === ui.selected ? inspector.scrollTop : 0;
  inspector.dataset.for = ui.selected || "";
  inspector.replaceChildren(...(!item ? overview() : item.container ? inspectGroup(item) : inspectNode(item.node)).filter(Boolean));
  inspector.scrollTop = scroll;
}

/* ---------- interaction ---------- */

function renderAll() { renderCrumbs(); renderOutline(); renderMap(); renderInspector(); renderLive(); }

function select(id, bringIntoView) {
  ui.selected = ui.selected === id && !bringIntoView ? null : id;
  if (ui.selected) reveal(ui.selected);
  if (ui.selected && !ui.anchors.has(ui.byId.get(ui.selected).ids[0])) { ui.focus = "root"; renderCrumbs(); renderMap(); }
  hideTip(); ui.hovered = null;
  decorate(); renderInspector();
  const row = document.querySelector(`#outline .row[data-id="${CSS.escape(ui.selected || "")}"]`);
  if (row) row.scrollIntoView({ block: "nearest" });
}

/* Open the outline down to `id`. */
function reveal(id) {
  let changed = false;
  for (let up = ui.parent.get(id); up; up = ui.parent.get(up.id)) changed = ui.closed.delete(up.id) || changed;
  if (changed) renderOutline();
}

function zoom(id) {
  const item = ui.byId.get(id);
  if (!item || !item.container) return;
  ui.focus = id;
  hideTip(); ui.hovered = null;
  renderCrumbs(); renderMap();
}

function hover(id, event) {
  if (ui.hovered === id) return;
  ui.hovered = id;
  drawLinks();
  const item = id && ui.byId.get(id);
  if (!item || !event) return hideTip();
  const tip = $("#tip");
  if (item.container) {
    const boxed = ui.items.get(id);
    if (!boxed || !boxed.box.collapsed) return hideTip();
    tip.replaceChildren(el("b", { text: item.label }), el("span", { text: `${plural(item.ids.length, "node", "nodes")} · click to open` }));
  } else {
    const node = item.node;
    tip.replaceChildren(el("b", { class: "mono", text: node.address }),
      node.origin ? el("span", { text: `${node.origin.module}${node.origin.declaration ? " › " + node.origin.declaration : ""}` }) : null,
      el("span", { text: [KIND_LABEL[node.kind], node.applied == null ? null : node.applied ? "applied" : "not applied yet",
        plural((ui.out.get(id) || []).length, "dependency", "dependencies"), plural((ui.into.get(id) || []).length, "dependent", "dependents")].filter(Boolean).join(" · ") }));
  }
  tip.classList.add("on");
  moveTip(event);
}
function moveTip(event) {
  const tip = $("#tip");
  if (!tip.classList.contains("on")) return;
  const { offsetWidth: width, offsetHeight: height } = tip;
  tip.style.left = `${Math.max(8, Math.min(event.clientX + 14, innerWidth - width - 8))}px`;
  tip.style.top = `${event.clientY + 18 + height > innerHeight ? event.clientY - height - 12 : event.clientY + 18}px`;
}
function hideTip() { $("#tip").classList.remove("on"); }

function segmented(id, key) {
  const root = $(id);
  const sync = () => root.querySelectorAll("button").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.value === ui[key])));
  root.addEventListener("click", (event) => {
    const button = event.target.closest("button");
    if (!button || ui[key] === button.dataset.value) return;
    ui[key] = button.dataset.value; store(`inframe.${key}`, ui[key]);
    if (key === "group") { ui.focus = "root"; if (ui.selected && !ui.nodes.has(ui.selected)) ui.selected = null; }
    sync(); rebuild();
  });
  sync();
}
segmented("#group", "group");
segmented("#size", "size");

$("#all-links").addEventListener("click", (event) => {
  ui.allLinks = !ui.allLinks;
  event.currentTarget.setAttribute("aria-pressed", String(ui.allLinks));
  drawLinks();
});
$("#search").addEventListener("input", (event) => { ui.query = event.target.value; decorate(); });
$("#search").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && ui.matching && ui.matching.size) select([...ui.matching][0], true);
});
$("#theme").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  store("inframe.theme", document.documentElement.dataset.theme);
});
if (stored("inframe.theme", "")) document.documentElement.dataset.theme = stored("inframe.theme", "");

addEventListener("keydown", (event) => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (event.key === "/" && !typing) { event.preventDefault(); $("#search").focus(); }
  else if (event.key === "Escape") {
    if (typing && ui.query) { ui.query = $("#search").value = ""; decorate(); }
    else if (typing) document.activeElement.blur();
    else if (ui.selected) select(ui.selected);
    else if (ui.focus !== "root") zoom((ui.parent.get(ui.focus) || ui.tree).id);
  }
});
$("#map").addEventListener("click", (event) => { if (event.target === event.currentTarget && ui.selected) select(ui.selected); });
new ResizeObserver(() => ui.tree && renderMap()).observe($("#map"));

/* ---------- live ---------- */

function renderLive() {
  const live = $("#live");
  const { model } = ui;
  const building = model.stacks.filter((stack) => stack.status === "building").map((stack) => stack.name);
  const failed = model.stacks.filter((stack) => stack.status === "failed").map((stack) => stack.name);
  $("#project").textContent = model.project.name;
  document.title = `${model.project.name} · Inframe`;
  let state = "live", text = "Live";
  if (!ui.connected) { state = "offline"; text = "Disconnected · retrying"; }
  else if (building.length) { state = "building"; text = `Building ${building.join(", ")}`; }
  else if (failed.length) { state = "failed"; text = `${plural(failed.length, "stack", "stacks")} failed to build`; }
  else {
    const latest = Math.max(0, ...model.stacks.map((stack) => stack.built_at_ms || 0));
    if (latest) text = `Live · built ${clock(latest)}`;
  }
  live.dataset.state = state;
  live.querySelector("span").textContent = text;
  live.title = "Stacks rebuild when their sources change";
}

let loading = null;
async function refresh() {
  if (loading) return loading;
  loading = (async () => {
    try {
      const response = await fetch("/api/model", { cache: "no-store" });
      const model = await response.json();
      if (model.stacks && (!ui.model || model.version !== ui.model.version)) ingest(model);
    } finally { loading = null; }
  })();
  return loading;
}

function connect() {
  const events = new EventSource("/api/events");
  events.addEventListener("open", () => { ui.connected = true; if (ui.model) renderLive(); });
  events.addEventListener("model", (event) => {
    ui.connected = true;
    if (!ui.model || Number(event.data) !== ui.model.version) refresh().catch(() => {});
  });
  events.addEventListener("error", () => { ui.connected = false; if (ui.model) renderLive(); });
}
refresh().then(connect, connect);
</script>
