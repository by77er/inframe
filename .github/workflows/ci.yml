name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Graph IR schema is current
        run: cargo run -q -p inframe-cli -- graph schema --output - | diff -u schemas/graph-ir-v1.schema.json -

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate pinned DigitalOcean bindings
        run: |
          cargo run -q -p inframe-cli -- provider generate \
            --schema-json fixtures/provider-schema/digitalocean-2.100.0.normalized.json
      - run: npm install --global purescript@0.15.16 spago@1.0.4
      - run: spago test -p inframe-graph-core
        working-directory: purescript
      - run: spago build -p integration-digitalocean
        working-directory: purescript
      - name: Compile top-level platform example
        working-directory: purescript
        run: |
          spago sources -p integration-digitalocean --quiet > /tmp/inframe-sources
          purs compile ../examples/digitalocean-platform/Main.purs \
            --source-globs-file /tmp/inframe-sources \
            --exclude-files 'test/**/*.purs' \
            --output output
      - name: PureScript to Graph IR to Rust
        run: |
          cd purescript
          spago run -p integration-digitalocean --main Infra.Main --quiet \
            | cargo run -q -p inframe-cli -- graph validate -
          spago run -p integration-digitalocean --main Infra.Platform --quiet \
            | cargo run -q -p inframe-cli -- graph validate -
      - name: Configured project build
        run: |
          cargo run -q -p inframe-cli -- build --stack example
          cargo run -q -p inframe-cli -- graph validate --stack example
          cargo run -q -p inframe-cli -- test --stack example
      - name: Upload the PureScript graph for cross-frontend comparison
        uses: actions/upload-artifact@v4
        with:
          name: purescript-graph
          path: .inframe/graphs/example.json

  lean:
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Core library and its proofs
        working-directory: lean
        run: |
          lake build
          lake -q exe inframe-test
      - name: Generate pinned DigitalOcean bindings
        run: |
          cargo run -q -p inframe-cli -- provider generate --frontend lean \
            --schema-json fixtures/provider-schema/digitalocean-2.100.0.normalized.json
      - name: Compile every generated module
        working-directory: lean/integration-digitalocean/.generated/digitalocean
        run: lake build
      - name: Lean to Graph IR to Rust
        working-directory: lean/integration-digitalocean
        run: |
          lake -q exe infra | cargo run -q -p inframe-cli -- graph validate -
          lake -q exe platform | cargo run -q -p inframe-cli -- graph validate -
      - name: Configured project build and compile-time policies
        run: |
          cargo run -q -p inframe-cli -- build --stack lean-example
          cargo run -q -p inframe-cli -- graph validate --stack lean-example
          cargo run -q -p inframe-cli -- test --stack lean-example
      - uses: actions/download-artifact@v4
        with:
          name: purescript-graph
          path: purescript-graph
      - name: Lean and PureScript render identical Graph IR
        run: diff purescript-graph/example.json .inframe/graphs/lean-example.json

  opentofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6
      - run: cargo run -q -p inframe-cli -- init --stack smoke --graph fixtures/graph-ir/digitalocean-tag.json -- -backend=false -input=false
      - run: cargo run -q -p inframe-cli -- validate --stack smoke --graph fixtures/graph-ir/digitalocean-tag.json
